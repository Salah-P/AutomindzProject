# Deploys Trigger.dev from the repo root (trigger.config.ts).
# Requires repo secret: TRIGGER_ACCESS_TOKEN
#   https://cloud.trigger.dev/account/tokens
#
# Optional secrets for syncEnvVars during deploy:
#   SUPABASE_URL, SUPABASE_SECRET_KEY
#
# Trigger.dev GitHub App can also deploy using the root trigger.config.ts.
# Prefer one or the other to avoid duplicate deploys.

name: Deploy Trigger.dev (prod)

on:
  push:
    branches:
      - main
    paths:
      - "trigger/**"
      - "trigger.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-trigger.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm install

      - name: Deploy to Trigger.dev
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npx trigger.dev@4.5.10 deploy --skip-update-check
