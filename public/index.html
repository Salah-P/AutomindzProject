<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Automindz Jobs</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="brand">
        <p class="logo">Automindz</p>
        <h1>Remote programming jobs</h1>
        <p class="lede">Search WeWorkRemotely by title — or drop in a CV for ranked matches.</p>
      </header>

      <form id="search-form" class="search">
        <label for="job-title">Job title</label>
        <div class="row">
          <input
            id="job-title"
            name="job_title"
            type="search"
            placeholder="e.g. python"
            required
            autocomplete="off"
          />
          <button type="submit">Search</button>
        </div>
      </form>

      <section class="cv-upload" aria-labelledby="cv-heading">
        <h2 id="cv-heading">Match from CV</h2>
        <p class="lede cv-lede">
          Upload a PDF or DOCX. We parse your profile, suggest titles, pull live jobs, and rank them.
        </p>
        <form id="cv-form" class="cv-form">
          <label class="file-label" for="cv-file">
            <span>Choose CV</span>
            <input
              id="cv-file"
              name="file"
              type="file"
              accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
              required
            />
          </label>
          <button type="submit" class="btn-secondary" id="cv-submit">Upload &amp; match</button>
        </form>
        <p id="cv-file-name" class="meta" aria-live="polite"></p>
        <p id="cv-status" class="status" aria-live="polite"></p>
        <div id="cv-profile" class="cv-profile" hidden></div>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
      <section id="results" class="results" aria-live="polite"></section>
    </main>
    <script src="./app.js?v=20260813b" type="module"></script>
    <!-- Vercel Web Analytics (enable in project → Analytics, then redeploy) -->
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
